name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-gate:
    name: Quality Gate (typecheck + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Type Check
      run: npx tsc --noEmit

    - name: Run Vitest (2490+ tests)
      run: npm run test
      env:
        NEXT_PUBLIC_SUPABASE_URL: "https://mock.supabase.co"
        SUPABASE_SERVICE_ROLE_KEY: "mock-key"
        APP_BASE_URL: "http://localhost:3000"
        TEST_AUTH_TOKEN: "dummy-token"

    - name: Production Build
      run: npm run build
      env:
        NEXT_PUBLIC_SUPABASE_URL: "https://mock.supabase.co"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock-anon-key"

  playwright:
    name: Playwright E2E (55+ tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality-gate

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium

    - name: Run Playwright tests
      run: npx playwright test --reporter=list
      env:
        NEXT_PUBLIC_SUPABASE_URL: "https://mock.supabase.co"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock-anon-key"
        SUPABASE_SERVICE_ROLE_KEY: "mock-key"

    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: playwright-report
        path: test-results/
        retention-days: 7

  # Note: Vercel handles the actual deployment automatically
  # when pushed to the main branch if the repo is connected.

