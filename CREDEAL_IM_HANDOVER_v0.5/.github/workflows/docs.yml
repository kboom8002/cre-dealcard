name: 문서·온톨로지 무결성

# 규격 문서와 검사기가 서로 어긋나는 것을 머지 전에 잡습니다.
# 수치가 악화되면 막고, 개선되면 기준선을 낮춰 되돌림을 방지합니다.

on:
  pull_request:
    paths:
      - '**.md'
      - 'credeal/ssot/**'
      - 'qa/**'
      - 'contracts/**'
  push:
    branches: [main]

jobs:
  docs:
    name: 문서 세트 · 온톨로지
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pyyaml

      # ── 세트 무결성 ──
      # 폐기 격리 · 끊긴 포인터 · 고아 · 포스처 계약 13칸 · 버전 · CHANGELOG
      - name: 문서 세트 무결성
        # 폐기 인용은 래칫입니다 — 늘면 실패, 줄면 --set-baseline 안내
        run: python3 qa/doc_integrity.py

      # ── 온톨로지 내부 ──
      # 폐기 문서 소유 지목 · 코드군 선언 vs 실측 · 포스처 커버리지 · 자릿수
      - name: 온톨로지 역방향 대조
        run: python3 qa/ontology_check.py

      # ── 레지스트리 ──
      - name: SSoT 레지스트리 자기검사
        run: python3 credeal/ssot/loader.py

  outputs:
    name: 산출물 검사 5층
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pyyaml python-pptx pillow pdfplumber

      # 🔴 양방향 보정 — 오탐 0 과 미탐 0 을 둘 다 봅니다.
      #    한쪽만 보면 검사기가 조용히 무력화됩니다.
      - name: 검사기 보정 (오탐/미탐)
        run: |
          python3 qa/calibrate.py
          python3 qa/calibrate_invariant.py

      - name: 참조구현 자기검사
        run: |
          python3 credeal/parcel.py --selftest
          python3 credeal/make_parity.py

      - name: 산출물 5층 검사
        run: |
          # 🔴 glob 은 조용히 0건을 잡을 수 있습니다. 개수를 먼저 확인합니다.
          shopt -s nullglob
          files=(credeal/*_IM_D22_A등급*.pptx)
          if [ ${#files[@]} -lt 2 ]; then
            echo "산출물이 ${#files[@]}건 — 최소 2건이어야 합니다"; exit 1
          fi
          for f in "${files[@]}"; do
            python3 qa/standard_check.py --kind pptx "$f"
            python3 qa/consistency_check.py "$f"
          done
          for f in credeal/*_모바일.html; do
            python3 qa/standard_check.py --kind mobile "$f"
          done
          python3 qa/invariant_check.py --fixture fixtures/yangpyeong.json \
            credeal/양평동_IM_D22_A등급.pptx

  # 렌더 회귀는 LibreOffice 가 필요해 분리합니다 (느립니다)
  render:
    name: 렌더 스냅샷 회귀
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'render')
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libreoffice poppler-utils
      - run: python3 qa/render_snapshot.py
