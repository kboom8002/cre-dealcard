meta:
  id: im.assumptions
  version: 1
  owner: ASSUMPTION_REGISTRY.md (D4) — 이 파일은 기계 판독 정본
  note: |
    D4 는 값·출처·영향을 표로 잘 정리했으나 **표는 코드가 읽지 못합니다.**
    현재 `credeal/core.py` 의 ASSUMED_LOAN_RATE 같은 상수가 D4 와 두 벌입니다.
    이제 코드는 이 파일만 읽습니다. D4 는 근거 서술을 소유하고,
    이 파일은 값을 소유합니다.
  review_cycle: 연 1회 + 시장 급변 시
  last_reviewed: 2026-08-24

# ── 계층 정의 ──────────────────────────────────────────────────────────
tiers:
  measured:
    label: 실측 — 공부·계약서
    default_allowed: false
  legal:
    label: 법정
    default_allowed: false
    rule: 조회 실패 시 기본값으로 채우지 않습니다. 산출을 거부합니다
  market_default:
    label: 시장 통상
    default_allowed: true
    review: 연 1회
  user_input:
    label: 사용자 입력
    default_allowed: false
    rule: 모르면 null 을 돌려주고 해당 지표를 산출하지 않습니다

# ── legal (7) — 기본값 없음 ────────────────────────────────────────────
legal:
  - key: acquisitionTaxRate
    value: 0.046
    unit: 비율
    confidence: high
    basis: 취득세 4.0 + 지방교육세 0.4 + 농특세 0.2 (상가·업무시설 표준세율)
    editable: false
    impact_if_wrong: 총취득원가·실투자금·모든 수익률이 어긋납니다
    review_trigger: 지방세법 개정
  - key: brokerFeeRateMax
    value: 0.009
    unit: 비율
    confidence: high
    basis: 공인중개사법 시행규칙 법정 상한 · 협의 가능
    editable: true
    impact_if_wrong: 총취득원가 소폭
    review_trigger: 공인중개사법 시행규칙 개정
  - key: targetFarByZoning
    value: null
    unit: '%'
    confidence: low
    basis: 용도지역별 법정 상한 · 토지이용계획 API
    editable: true
    on_lookup_fail: 산출 거부
    impact_if_wrong: 신축 규모·분양수입·사업이익률이 전부 어긋납니다
    incident: |
      현행 코드가 400% 를 일괄 적용했습니다. 잠원동(제2종일반주거 250%)에서
      지상 연면적이 1,540㎡ → 2,464㎡ 로 +60% 과대 산출되었습니다.
    invariant: 4
  - key: bcrByZoning
    value: null
    unit: '%'
    confidence: low
    basis: 용도지역별 건폐율 상한 · 토지이용계획 API
    editable: true
    on_lookup_fail: 산출 거부
    impact_if_wrong: 건축 가능 규모가 어긋납니다
  - key: transferTaxRate
    value: null
    unit: 비율
    confidence: medium
    basis: 보유기간 분기 — 1년 미만 50% / 그 외 6~45% · 주택 중과 미적용
    editable: true
    on_lookup_fail: 매수 주체 확인 필요
    impact_if_wrong: 세후 수익 비교가 뒤집힐 수 있습니다
    review_trigger: 소득세법 개정
  - key: regulationBasis
    value: 서울시 소규모 건축물 한시적 용적률 완화
    unit: 제도명
    confidence: high
    basis: 2025-05-19 시행 · 3년 한시
    editable: false
  - key: regulationExpiry
    value: '2028-05-18'
    unit: 날짜
    confidence: high
    basis: 한시 제도 종료일
    editable: false
    rule: 한시 제도를 근거로 사업성을 제시할 때는 종료일과 잔여 기간을 반드시 병기합니다
    derived: regulationDaysLeft = regulationExpiry − 발행일
    incident: 잠원동 IM(2026-04)에 잔여 749일이었으나 기한 표기가 없었습니다

# ── market_default (8) — 연 1회 갱신 ──────────────────────────────────
market_default:
  - key: constructionCostPerPyeong
    value: 12000000
    unit: 원/평
    confidence: medium
    basis: 서울 소형 근생 신축 2026 통상 단가
    editable: true
    evidence: 잠원동 IM p16 — 614.03평 × 1,200만 = 73.68억
    impact_if_wrong: 614평 기준 1만원 오차 = 614만원. 총사업비·개발이익률 직접 영향
    was: 8000000
    correction_note: 현행 800만원은 실물 대비 33% 과소 · 614평에서 24.56억 차이
  - key: devContingencyRate
    value: 0.05
    unit: 비율
    confidence: medium
    basis: 총사업비 대비 예비비 · 통상 3~7%
    editable: true
    was: 0.15
  - key: loanRateDefault
    value: 0.045
    unit: 연 이율
    confidence: medium
    basis: 2026 상업용 담보대출 통상
    editable: true
    impact_if_wrong: 역레버리지 판정이 뒤집힙니다 — 수익률 2%대 물건은 경계에 민감
    review_trigger: 기준금리 50bp 이상 변동
  - key: ltvScenarios
    value: [0.0, 0.4, 0.5]
    unit: 비율
    confidence: high
    basis: 표준 제시 3안
    editable: true
  - key: pfEquityRatioByYear
    value: {2026: 0.10, 2027: 0.15, 2028: 0.20}
    unit: 비율
    confidence: high
    basis: PF 자기자본비율 규제 로드맵
    editable: false
    scope: 개발형
  - key: depreciationYears
    value: 40
    unit: 년
    confidence: low
    basis: 철근콘크리트 건물 정액
    editable: true
    open_question: 세무 확인 필요
  - key: buildingValueRatio
    value: 0.35
    unit: 비율
    confidence: low
    basis: 매매가 중 건물분 · 20~50% 편차 큼
    editable: true
    impact_if_wrong: 사옥형 절세 효과가 배로 달라집니다 · 세후 판단 반전 가능
  - key: seoulHotelRevPar
    value: 207345
    unit: 원
    confidence: medium
    basis: 서울 호텔 2025 평균 · 4~5성급 포함
    editable: true
    scope: 운영형

# ── user_input (6) — null 허용 ────────────────────────────────────────
user_input:
  - key: opexKrw
    blocks_if_null: [noi_price, noi_total, noi_equity, noi_gap]
    invariant: 1
    note: 운영비를 모르면 NOI 를 산출하지 않습니다. gross 계열만 냅니다
  - key: gopMarginPct
    blocks_if_null: [gop, gop_cap_rate]
    scope: 운영형
  - key: manualComps
    blocks_if_null: [target_exit_price, market_gap, comps_table]
    invariant: [5, 16]
  - key: marketRentPerPyeong
    blocks_if_null: [owner_occupied_saving]
    scope: 사옥형
  - key: appraisedValueKrw
    blocks_if_null: [actual_loan_capacity]
  - key: firstContractDate
    blocks_if_null: [renewal_right_years]
    invariant: 7

# ── 폐기 상수 6종 — 되살리지 않습니다 ──────────────────────────────────
retired:
  - key: noiEstimateCoefficient
    was: 0.85
    reason: 근거 없음 · 문서·주석 전무
    replacement: gross 계열만 산출
    invariant: 1
  - key: opexRatioByPosture
    was: 0.12~0.35
    reason: 출처 없음 · 호텔 35% 는 GOP 마진과 혼동 의심
    replacement: opexKrw 실입력
    open_question: |
      financials.ts:132 Opex Ratio 호텔 35% 와 financials.ts:421 GOP 마진율
      기본값 35% 가 같습니다. Opex 35% 면 GOP 마진이 65% 가 되는데 업계 통상은
      30~40% 입니다. **호텔 포스처에서 GOP 가 약 2배로 산출되고 있을 가능성**
  - key: devFarDefault
    was: 4.0
    reason: 용도지역 무시 · +60% 과대
    replacement: targetFarByZoning
  - key: devConstructionCost
    was: 8000000
    reason: 실물 1,200만원 · 33% 과소
    replacement: constructionCostPerPyeong
  - key: tradingTargetExitMultiple
    was: 1.2
    reason: comps 없이 차익 23억 창작
    replacement: manualComps 필수
    invariant: 5
  - key: tradingCompsMultiple
    was: 1.15
    reason: 동일
    replacement: manualComps 필수

# ── comps 자동조회 커버리지 ────────────────────────────────────────────
comps_coverage:
  main_band_krw: [3000000000, 50000000000]
  auto_lookup_min_krw: 2000000000
  auto_lookup_max_krw: 30000000000
  gap: |
    상단 300억 초과가 잘려 주력 상단(B4 300~500억)이 통째로 막혀 있습니다.
    금액폭 기준 42.6%. 하단 20억 미만 제외는 주력 밖이라 영향 없습니다.
  hardcode_source: price-prediction.ts:77
  upper_bound_rationale: 확인 필요 — 코드에 주석 없음
  action: 상한 제거 또는 500억으로 상향 검토
  fallback: requiresManualComps() 가 true 면 가격 근거 섹션을 렌더하지 않습니다
  invariant: 16

# ── 갱신 절차 ──────────────────────────────────────────────────────────
governance:
  change_via: PR only — 화면에서 편집 불가
  approval: 개발팀 + 도메인 2인
  on_change:
    - 기발행 IM 은 소급 변경하지 않습니다 (발행 시점 값을 스냅샷에 남깁니다)
    - 발행일 기준 90일 이내 IM 은 재발행 대상으로 표시합니다
  display_rule: 화면에 basis 를 함께 노출합니다 — "평당 공사비 1,200만원 ◇ 서울 소형 근생 신축 2026년 통상 단가"
