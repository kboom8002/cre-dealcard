# ── 공부 교차검증 (D19 §2.1) ───────────────────────────────────────────
  - code: G27
    label: X05 필지 합 일치
    level: 차단
  - code: G28
    label: 같은 지표가 모든 면에서 같은 값
    level: 차단
    invariant: 22
  - code: G29
    label: 마스킹이 업종을 지우지 않았는가
    level: 차단
    invariant: 23
  - code: G30
    label: 포스처 확장 계약 13칸 충족
    level: 차단
crosschecks:
  - code: X01
    label: 건폐율 × 대지 = 건축면적
    tolerance_pct: 1.0
  - code: X02
    label: 용적률 × 대지 = 용적률산정 연면적
    tolerance_pct: 2.0
    fallback: 용적률산정 연면적이 없으면 층별 지상합과 비교
  - code: X03
    label: 층별개요 합 = 연면적
    tolerance_pct: 0.5
    condition: floorTableKind == official
    same_as: C19
    alt:
      label: 계약면적 합 ≤ 연면적
      condition: floorTableKind == lease
      output: 차이 = 공용·기계실 · 임대면적 비율
  - code: X04
    label: 대지 × ㎡당 공시지가 = 총액
    tolerance_pct: 1.0

# ── 재무 상한 단언 ─────────────────────────────────────────────────────
  - code: X05
    label: Σ 필지 면적 = 공부 대지면적
    tolerance: 0.5%
    level: 차단
    gate: G27
    owner: CATALOG_RULES.md §2.3
    why: |
      🔴 필지 합이 대장과 안 맞으면 **필지 목록이 불완전**하다는 뜻입니다.
      그 위에서 P01~P04 를 계산하면 유효 대지·유효 용적률이 전부 틀립니다.
      양평동이 3필지 합지였다는 사실이 이 검사로 드러났습니다.
    note: X01·X02 가 경고인 것과 달리 차단입니다 — 반올림 오차가 아니라 결손입니다
financial_assertions:
  - key: roe_ceiling
    rule: 역레버리지 구간에서 자기자본 수익률은 무차입 ROE를 넘지 않는다
    checked_by: [QA-LEV-02]
  - key: negative_leverage_sign
    rule: 대출을 쓴 경우의 ROE는 음수여야 한다 (무차입·상한 문맥 제외)
    checked_by: [QA-LEV-01]
  - key: equity_basis
    rule: 실투자금 = 총취득원가 − 보증금 − 대출 (매매가가 아님)
    checked_by: [QA-DUP-02]
  - key: acq_tax
    rule: 취득세 4.6% = 취득세 4.0 + 지방교육세 0.4 + 농특세 0.2
    source: 상가·업무시설 표준세율
    review_trigger: 세법 개정
  - key: broker_fee
    rule: 중개보수 0.9% 법정 상한
    review_trigger: 공인중개사법 시행규칙 개정
