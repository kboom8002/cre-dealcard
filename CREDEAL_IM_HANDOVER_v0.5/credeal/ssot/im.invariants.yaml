# ── 발행 게이트 ────────────────────────────────────────────────────────
# 🔴 코드 정본은 im.errors.yaml 입니다. 여기는 불변조건과 엮인 것만 재게합니다.
#    F11~F13 은 F(Freshness) 코드군과 충돌하여 G22~G24 로 이관했습니다.
#    C19(임대면적)는 CATALOG C19(층별 바닥면적)와 충돌하여 C33 으로 개명했습니다.
  - n: 22
    applies_to: all   # ONTOLOGY_V0.5_SPEC §7
    text: 같은 지표는 모든 면에서 같은 값이어야 한다
    why: |
      평당가가 한 면에서 15,933만원, 다른 면에서 1억 5,923만원이었고
      🔴 **검사기 5층이 전부 통과시켰습니다.** 면 내부만 보고 면 사이를
      보지 않았기 때문입니다.
    checked_by: [G28, qa/consistency_check.py]
    verified: true
  - n: 23
    applies_to: all   # ONTOLOGY_V0.5_SPEC §7
    text: 마스킹은 상호를 가리되 업종을 지우지 않는다
    why: |
      '[TENANT_A]' 하나로 뭉개면 불변조건 6(업종 원문)과 14(상호 미표기)가
      충돌합니다. 업종은 투자 판단의 핵심 정보이고 상호는 개인정보입니다.
    checked_by: [G29, 'qa/invariant_check.py QA-SRC-01']
    verified: true
