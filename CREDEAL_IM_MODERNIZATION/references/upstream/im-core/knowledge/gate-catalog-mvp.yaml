    effect: BLOCK_RELEASE
    risk_class: RC2
    observation_type: version
    scope: publication
    predicate: all claims proposals and media bindings resolve to one snapshot and package
  - id: ICG-018-HASH-AND-APPROVAL
    label: 승인대상 해시 일치
    effect: BLOCK_RELEASE
    risk_class: RC2
    observation_type: approval
    scope: publication
    predicate: expected hash equals server hash and required approvals target current hashes

