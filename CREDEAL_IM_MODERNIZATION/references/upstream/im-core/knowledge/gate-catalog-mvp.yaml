    effect: DOWNGRADE
    risk_class: RC1
    observation_type: approval
    scope: proposal
    predicate: evidence buyer meaning condition public copy and approval exist
    downgrade_to: L1
  - id: ICG-012-PHOTO-DISCLOSURE
    label: 사진 공개승인과 가림처리
    effect: BLOCK_RELEASE
    risk_class: RC2
    observation_type: photo
    scope: photo
    predicate: disclosure approval and required redaction version match
  - id: ICG-013-MULTIPARCEL-PROPAGATION
    label: 대표필지 사실 전체전파 금지
    effect: BLOCK_CLAIM
    risk_class: RC2
    observation_type: identity
    scope: claim
    predicate: parcel-specific value is not propagated without evidence for every included parcel
  - id: ICG-014-OWNER-USE-NOT-VACANCY
    label: 자가사용과 공실 분리
    effect: BLOCK_CLAIM
    risk_class: RC1
    observation_type: calculation
    scope: claim
    predicate: owner occupied area is separately classified from vacancy
  - id: ICG-015-EXPIRED-LEASE-MATERIALITY
    label: 만료계약 현재수입 사용조건
    effect: BLOCK_CLAIM
    risk_class: RC1
    observation_type: calculation
    scope: claim
    predicate: expired lease occupancy payment and materiality policy are evaluated
    note: thresholds remain provisional until calibrated
  - id: ICG-016-DEVELOPMENT-THEORETICAL-LABEL
    label: 개발 이론값 표시경계
    effect: BLOCK_CLAIM
    risk_class: RC2
    observation_type: copy
    scope: claim
    predicate: value is labeled theoretical and not actual permitted scale with mandatory caveat
  - id: ICG-017-SINGLE-SNAPSHOT
