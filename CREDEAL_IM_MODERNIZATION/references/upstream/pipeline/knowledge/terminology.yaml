catalog_version: 1.0.0
owner: im-product
status: proposed_normative
terms:
  - canonical_ko: 파이프라인 실행
    english: Pipeline Run
    definition_ko: 입력접수부터 공통 발행묶음 또는 요청채널 결과까지의 한 번의 추적 가능한 처리
    avoid_ko: 생성 잡
  - canonical_ko: 단계 실행
    english: Stage Execution
    definition_ko: 하나의 단계가 특정 입력 산출물로 수행된 한 번의 시도
    avoid_ko: 스텝 러닝
  - canonical_ko: 유효기준본
    english: Effective Snapshot
    definition_ko: 불일치와 정정을 반영해 특정 기준일에 발행이 참조하는 불변 사실집합
  - canonical_ko: 산출항목
    english: Claim
    definition_ko: 외부 문서에서 사실·계산·판단으로 표시하려는 구조화 항목
    avoid_ko: 클레임
  - canonical_ko: 외부 사용허가상태
    english: Claim Use Status
    definition_ko: 산출항목을 외부 문서에 사용할 수 있는지 나타내는 상태
  - canonical_ko: 공통 발행묶음
    english: Publication Package
    definition_ko: 모바일과 PPTX가 함께 쓰는 허용 사실·의견·사진·주의·출처의 불변 묶음
    avoid_ko: 퍼블리케이션 패키지
  - canonical_ko: 기계 발행검사
    english: Machine Publication Gate
    definition_ko: 규칙과 관측값으로 발행 가능여부를 판정하는 자동검사
    avoid_ko: 게이트 통과 승인
  - canonical_ko: 사람승인
    english: Human Approval
    definition_ko: 특정 사용자가 특정 해시의 사실·문안·사진·파일을 확인한 사건
  - canonical_ko: 불변 산출물
    english: Immutable Artifact
    definition_ko: 생성 후 수정하지 않고 새 버전으로만 교체하는 단계 결과
  - canonical_ko: 산출물 계보
    english: Artifact Lineage
    definition_ko: 원자료부터 발행문장·표·사진·파일까지의 생성·참조 관계
  - canonical_ko: 작업임대
    english: Worker Lease
    definition_ko: 한 작업자가 일정 시간 동안 단계 실행권을 갖는 장치
    avoid_ko: 락 잡기
  - canonical_ko: 심장박동
    english: Heartbeat
    definition_ko: 실행 중인 작업자가 생존과 임대연장을 알리는 주기 신호
  - canonical_ko: 멱등키
    english: Idempotency Key
    definition_ko: 같은 요청의 중복 실행을 막고 기존 결과를 돌려주기 위한 식별키
  - canonical_ko: 사건 보관함
    english: Transactional Outbox
    definition_ko: DB 변경과 사건발행을 유실 없이 연결하는 저장영역
    avoid_ko: 이벤트 아웃박스
  - canonical_ko: 변경영향 판정
    english: Change Impact Analysis
    definition_ko: 변경이 어떤 산출물·승인·발행본을 무효화하는지 계산하는 절차
  - canonical_ko: 재생성 계획
    english: Regeneration Plan
    definition_ko: 재사용·무효화·재실행할 단계와 채널을 명시한 실행안
  - canonical_ko: 오래된 상태
    english: Stale
    definition_ko: 상위 사실·규칙·문안 변경으로 현재성을 잃은 산출물 또는 발행본
    avoid_ko: 스테일 상태
  - canonical_ko: 형제 발행채널
    english: Sibling Publication Channels
    definition_ko: 같은 공통 발행묶음에서 독립 제작되는 모바일과 PPTX
  - canonical_ko: 지면검사
    english: Layout Validation
    definition_ko: PPTX의 넘침·겹침·잘림·저해상도·빈면 등을 확인하는 검사
  - canonical_ko: 구조화 수치잠금
    english: Structured Numeric Binding
    definition_ko: 문안 숫자를 산출항목 참조로 유지해 임의 변조를 막는 방식

