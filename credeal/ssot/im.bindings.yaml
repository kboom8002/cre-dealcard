meta:
  id: im.bindings
  version: 1
  owner: D23 IM_PIPELINE_UPGRADE.md
  note: |
    운영 파이프라인의 산출물과 이 레지스트리를 **이름 단위로** 잇습니다.

    지금까지 두 세계가 따로 있었습니다.
      운영  메모 슬롯 40+ · layers JSONB · 바텀시트 필드 · 아키타입 A01~A17
      규격  필드 49 · 블록 51 · 페이지 15 · 게이트 G01~G26

    이름이 다르면 "같은 것"인지 아무도 확신하지 못하고, 결국 양쪽에
    비슷한 로직이 하나씩 생깁니다. 이 파일이 대응표입니다.
    **대응이 없는 항목은 `unmapped` 에 남깁니다** — 조용히 버리지 않습니다.
  source_docs:
    - 01_PIPELINE_FUNCTIONAL_SPEC.md
    - 02_MOBILE_IM_CONTENT_GENERATION_AND_RENDERING_SPEC.md
    - 03_PPTX_IM_CONTENT_GENERATION_AND_RENDERING_SPEC.md

# ── 🔴 코드 네임스페이스 3중 충돌 ──────────────────────────────────────
# im.errors.yaml 의 conflicts C1~C4 에 이어 다섯 번째입니다.
# 이번 것은 **운영 코드에 이미 들어가 있어** 가장 위험합니다.
namespace_collision:
  code: G01~G16
  severity: 차단
  occurrences:
    - source: CATALOG_RULES.md §4
      meaning: 발행 게이트 — 오버플로 · 빈 플레이스홀더 · 면책 · provenance · 밴딩 …
      status: 정본
    - source: quality-gates-v02.ts (운영 코드)
      meaning: 데이터 무결성 · PII 누출 · 규제 준수 · 수치 교차
      status: 🔴 운영 중 · 정본과 다른 의미
    - source: credeal/ssot/im.errors.yaml
      meaning: CATALOG 승계 + G17~G26 신설
      status: 등록요청
  impact: |
    "G07 실패" 라는 로그 한 줄이 세 가지를 뜻할 수 있습니다.
    CATALOG G07 = 제약 C01~C33 검증
    운영  G07 = (미확인 — 데이터 무결성 계열 중 하나)
    발행 API 가 4xx 를 내도 어느 규칙이 막았는지 특정되지 않습니다.
  resolution:
    - 운영 게이트를 **QG01~QG16** 으로 개명합니다 (Quality Gate)
    - CATALOG G 는 발행 게이트 전용으로 남깁니다
    - 두 계열의 대응은 아래 gate_map 이 소유합니다
  priority: 스프린트 1 — FR02 와 함께

# ── 메모 슬롯 → 레지스트리 필드 ────────────────────────────────────────
memo_slots:
  mapped:
    - {slot: exactAddressCandidate, field: address_jibun, axis: P1}
    - {slot: askingPriceKrw, field: price_krw}
    - {slot: monthlyRentKrw, field: rr_rent, note: 총액 — 행별은 렌트롤 임포터}
    - {slot: totalDepositKrw, field: rr_deposit, note: 총액}
    - {slot: loanAmountKrw, field: loan_balance}
    - {slot: totalFloorAreaPyung, field: gfa_sqm, transform: 평 → ㎡ (× 3.305785)}
    - {slot: landAreaPyung, field: land_sqm, transform: 평 → ㎡}
    - {slot: vacancyRatePct, field: rr_state, note: 파생 — 행별 상태에서 재계산해야 합니다}
    - {slot: tenantNames, field: rr_business, caution: 🔴 상호와 업종이 한 슬롯}
  unmapped_slot_to_field:
    - slot: capRatePct
      why_blocked: |
        🔴 **레지스트리에 대응 필드를 두지 않습니다.**
        슬롯 설명이 "Regex + 역산 · 연 순수익률" 입니다. 두 가지가 틀렸습니다.
        ① 운영비 없이 "순수익률" 을 만들 수 없습니다 (불변조건 1·3).
        ② 메모에서 뽑거나 역산한 수익률에는 basis 가 없습니다 (불변조건 2).
        메모에 적힌 수익률은 **중개인 주장**이므로 별도 슬롯으로 받아
        `claimed_yield` 로 두고 산출값과 나란히 보여줍니다.
      action: 슬롯 폐기 → claimed_yield 신설 (S3 · 화면에 "중개인 제시" 병기)
  missing_slots:
    - {field: rr_as_of, why: 기준일 없이는 만료 판정이 전부 틀립니다 (G18)}
    - {field: buyer_purpose, why: L12 목적별 토지이용계획 표시가 못 돕니다}
    - {field: parcel_list, why: 다필지 물건이 단일 필지로 처리됩니다 (D22-8)}
    - {field: mgmt_bearer, why: 관리비 금액만 있고 부담 주체가 없습니다}

# ── PII 마스킹 ─────────────────────────────────────────────────────────
pii_masking:
  current: [RRN_A, EMAIL_A, PHONE_A, ADDR_DETAIL_A, OWNER_A, TENANT_A, BLDG_NAME_A]
  issue:
    code: TENANT_A
    severity: 중대
    detail: |
      🔴 **마스킹이 과해서 불변조건 6 을 못 지킵니다.**
      "㈜스타벅스" → `[TENANT_A]` 로 통째로 지우면 **업종까지 사라집니다.**
      불변조건 14 는 상호를 가리라 하고, 불변조건 6 은 업종을 원문 그대로
      쓰라고 합니다. 두 규칙을 동시에 지키려면 두 조각으로 나눠야 합니다.
    fix: |
      TENANT_A 를 둘로 나눕니다.
        [TENANT_NAME_A]  상호 — 어느 단계에서도 복원하지 않습니다
        업종             원문 유지 — 마스킹 대상이 아닙니다
      메모 파서가 "㈜스타벅스 카페" 에서 상호와 업종을 분리하지 못하면
      **업종을 비우고 확인사항으로 넘깁니다.** 추론하지 않습니다 (G17).
  missing: [이미지 — D22-2 소관 · 텍스트 마스킹만 있고 사진 경로가 없습니다]

# ── layers JSONB → 레지스트리 ──────────────────────────────────────────
