  mapped:
    - {path: layers.finance.asking_price_krw, field: price_krw}
    - {path: layers.finance.monthly_rent_krw, field: rr_rent}
    - {path: layers.finance.total_deposit_krw, field: rr_deposit}
    - {path: layers.finance.loan_amount_krw, field: loan_balance}
    - {path: layers.lease_summary.tenants, field: rentroll_table}
    - {path: layers.location.pnu, field: address_jibun}
    - {path: layers.photos, field: photo_ext / photo_int, ref: im.image.yaml slots}
    - {path: layers.building_register, ref: PUBLIC_AUTO (land_sqm·gfa_sqm·bcr·far…)}
  missing_layers:
    - path: layers.land
      holds: ["parcels[]", "exclusions[]", effectiveArea, parcelCount, parcelsKnown]
      why: 🔴 필지 배열이 들어갈 자리가 없습니다. location 에는 대표 주소·PNU 뿐입니다
      ref: CATALOG_SLOTS.md §2.1 · im.parcel.yaml
    - path: layers.zoning.items
      holds: 토지이용계획 확인원 전 항목
      why: L12 목적별 표시의 입력. 지금은 zoningOverlap 문자열 하나로 뭉쳐 있습니다
    - path: layers.lease_as_of
      holds: 임대 현황 기준일
      why: G18 · 만료 게이트 G22~G24 의 기준
  schema_risk: |
    🔴 `layers` 가 자유 JSONB 입니다. 스키마 검증이 없으면 필드명이 조용히
    흘러갑니다. `im.gating.yaml` 의 필드 49개를 JSON Schema 로 생성해
    쓰기 시점에 검증하십시오 (D23 §3.2).

# ── 출처 등급 ──────────────────────────────────────────────────────────
provenance:
  mapping:
    - {ops: public_data, coeff: 1.00, registry: S1 또는 S2a, caution: 🔴 둘을 구분해야 합니다}
    - {ops: expert_verified, coeff: 0.95, registry: S1}
    - {ops: seller_declared, coeff: 0.65, registry: S3}
    - {ops: broker_input, coeff: 0.60, registry: S3}
    - {ops: ai_inferred, coeff: 0.30, registry: S5, display: ◇}
  missing:
    - grade: S2a
      label: 공공 API 원시
      why: 지번이 마스킹되고 집합건물 대지면적이 없습니다. 그대로 쓸 수 없습니다
    - grade: S2b
      label: 공공 API + 중개인 보강
      why: |
        🔴 현행 `public_data` 계수 1.00 이 실거래 comps 에도 붙습니다.
        RTMS 는 지번을 `1***` 로 마스킹하므로 **어느 건물인지 모르는 채로
        1.00 을 받습니다.** 중개인이 식별·대로변/이면·규모를 얹어야 쓸 수
        있는 값이고, 그때 비로소 S2b 입니다.
    - grade: S4
      label: 파생
      why: 계산으로 만든 값이 원천값과 같은 등급을 받고 있습니다

# ── 등급 체계 ──────────────────────────────────────────────────────────
grade:
  current: {scale: [A, B, C], basis: 100점 8카테고리 가중합, thresholds: {A: 75, B: 40}}
  registry: {scale: [A, B, C, D], basis: L축(임대차 R0~R3) × P축(물건자료 P0~P3)}
  gap: |
    단일 점수는 **무엇이 부족한지 말하지 못합니다.**
    68점이 나왔을 때 임대차가 얇은 것인지 공부가 없는 것인지 구분되지 않고,
    중개인은 무엇을 채워야 할지 모릅니다.
    L×P 이중 축은 "관리비와 계약 시작일 두 개면 R2" 처럼 다음 한 걸음을
    특정합니다.
  bridge:
    - 8카테고리를 두 축으로 나눕니다
    - "L축": [lease_roll]
    - "P축": [building_basic, land_parcel, zoning, road_access, market_comp]
    - "축 무관": [financial_input, title_encumbrance]
    - 점수는 유지하되 **표시는 L×P 로** 합니다 — 점수는 정렬용, 축은 안내용
  keep: |
    현행 규칙 하나는 그대로 좋습니다 —
    "income·operating 포스처는 구조화 렌트롤 필수 · 미충족 시 B 캡".
    여기에 **전량 표기(불변조건 18)** 조건을 더합니다. 지금은 렌트롤이
    "있는지"만 보고 원장 행수와 대조하지 않습니다.

# ── 섹션 ↔ 페이지 ──────────────────────────────────────────────────────
sections:
  note: |
    모바일 7섹션과 im.pages.yaml 15면은 층위가 다릅니다.
    섹션은 **서사 단위**, 면은 **지면 단위**입니다. 한 섹션이 두 면이
    되기도 합니다. 아래는 내용 소유 기준의 대응입니다.
  map:
    - {section: property_overview, pages: [cover, overview]}
    - {section: location_access, pages: [location]}
    - {section: lease_status, pages: [rentroll, lease2]}
    - {section: income_analysis, pages: [invest, market]}
    - {section: risk_check, pages: [risk]}
    - {section: investment_thesis, pages: [points]}
    - {section: next_steps, pages: [terms]}
  missing_sections:
    - {page: parcels, why: 필지 명세 — 모바일에 parcels_sec 신설 (D22-8)}
    - {page: land, why: 토지·공법 — 지금은 property_overview 에 섞여 있습니다}
    - {page: evidence, why: 공부 교차검증 X01~X05 — 대응 섹션 없음}
    - {page: landvalue, why: 토지 가치·용적 여력 — 대응 섹션 없음}
    - {page: photos_ext, why: 사진 갤러리 — 뷰어에는 있으나 섹션이 아님}

# ── 아키타입 ↔ 페이지 ──────────────────────────────────────────────────
archetypes:
  note: |
    🔴 **편성 결정이 두 곳에 있습니다.**
    `deck-sequencer.ts` 가 Posture×Grade 로 A01~A17 순서를 정하고,
    `im.pages.yaml` 이 프리셋별 면 순서를 정합니다. 둘 다 살아 있으면
    프리셋을 바꿔도 순서가 안 바뀌거나, 반대로 두 번 바뀝니다.
  resolution: |
    `im.pages.yaml` 이 **무엇을 어떤 순서로** 를 소유합니다.
    아키타입은 **그 면을 어떤 형태로 그릴지** 만 소유합니다.
    deck-sequencer 는 pages 를 읽어 아키타입을 고르는 함수로 축소합니다.
  map:
    - {page: cover, archetype: A01}
    - {page: points, archetype: A02}
    - {page: overview, archetype: A04}
    - {page: location, archetype: A06}
    - {page: parcels, archetype: A04, status: 신설 필요 — 전용 형태 없음}
    - {page: land, archetype: A04}
    - {page: rentroll, archetype: A03}
    - {page: lease2, archetype: A04}
    - {page: invest, archetype: A16}
    - {page: market, archetype: A03}
    - {page: risk, archetype: A07}
    - {page: evidence, archetype: A08, status: 신설 필요}
    - {page: landvalue, archetype: A05}
    - {page: photos_ext, archetype: A14}
    - {page: photos_int, archetype: A14}
    - {page: terms, archetype: A09 + A10}
  unmapped_archetypes:
    - {code: A11, name: 호실 사양, note: 렌트롤 정밀 모드용 — 수익형 범위 밖}
    - {code: A12, name: 소유 구조, note: 다필지·공유지분과 연결 가능 (D22-8)}
    - {code: A13, name: 운영 KPI, note: 운영형 전용}
    - {code: A17, name: 준공전 마케팅, note: 개발형 전용}

# ── 게이트 대응 ────────────────────────────────────────────────────────
gate_map:
  note: 운영 QG(개명 후) ↔ CATALOG G ↔ 레지스트리
  rows:
    - {ops: 데이터 무결성 — 가격 아웃라이어, ops_new: QG01, registry: C01~C33 계열}
    - {ops: 데이터 무결성 — 면적 비정상, ops_new: QG02, registry: C19·C33·X01~X05}
    - {ops: 데이터 무결성 — 0원 임대료, ops_new: QG03, registry: format.missing 위반}
    - {ops: PII 누출, ops_new: QG04, registry: 불변조건 14 · masking}
    - {ops: 규제 준수 — 위험 표현, ops_new: QG05, registry: lexicon.banned 26종}
    - {ops: 수치 교차 — 섹션 간 불일치, ops_new: QG06, registry: consistency_check}
  missing_in_ops:
    - {registry: G01, label: 텍스트 오버플로 0건, ops: assertBounds 는 있으나 발행 차단 아님}
    - {registry: G10, label: 모든 수익률에 basis, ops: basis-enforcer 가 PPTX 에만 있음}
    - {registry: G12, label: 제척 합계 ≤ 대지 합계, ops: 없음}
    - {registry: G17, label: 업종 미기재 시 추론 금지, ops: 앵커 임차인 소독은 브랜드명만}
    - {registry: G18, label: 임대 현황 기준일 존재, ops: 없음}
    - {registry: G19, label: 표지 요약 = 각 행의 합, ops: 없음}
    - {registry: G20, label: 이미지 마스킹 승인 이력, ops: 없음}
    - {registry: G22~G24, label: 만료 게이트, ops: 없음}
    - {registry: G26, label: 사진 최소 6매, ops: 없음}

# ── 표기 규칙 위반 ─────────────────────────────────────────────────────
format_violations:
  - where: data-binder.ts sanitizePersona()
    current: NaN/null/undefined + 단위 → "--"
    rule: im.format.yaml missing.forbidden_tokens 에 "-" 와 "—" 가 있습니다
    why: |
      🔴 "--" 는 매수인이 **"해당 없음"** 으로 읽습니다. 실제로는
      "아직 모른다" 입니다. 두 상태를 같은 기호로 쓰면 확인 요청이 사라집니다.
    fix: '"확인 필요" 로 바꾸고, 계산 불가면 "{이유} {대상}을 산출하지 않았습니다"'
  - where: text-budget.ts enforceTextBudget()
    current: 초과 시 "…" 로 절단
    rule: im.budget.yaml truncation.never — 라벨·표 헤더·단위·출처·제목·수치
    why: |
      🔴 TEXT_LIMITS 의 statValue(10) · tableHeader(16) · statLabel(18) 은
      **자르면 안 되는 것들**입니다. D17 E01 사고가 정확히 이 경로입니다 —
      "현재 연 순수익률 (Cap R" 에서 문장이 끊겼습니다.
    fix: |
      요소 종류를 인자로 받아 never 목록이면 절단 대신 예외를 던집니다.
      호출부가 폰트를 줄이거나 다음 면으로 흘립니다.
  - where: a03-large-table.ts
    current: 셀 45자 절단 · 최대 12행 트림
    rule: 불변조건 18 — 렌트롤은 전량 표기
    why: 🔴 13행짜리 렌트롤이 **조용히 12행이 됩니다.** 사라진 행을 아무도 모릅니다
    fix: 12행을 넘으면 자동 페이지 분할 (L.table autoPage 는 이미 있습니다)
  - where: a16-investment-structure.ts
    current: 취득세 4.6% · 중개보수 0.9% 하드코딩
    rule: im.assumptions.yaml legal 계층
    fix: assumption('acquisitionTaxRate') · assumption('brokerFeeRateMax')

# ── 검증 임계 ──────────────────────────────────────────────────────────
validation_thresholds:
  - name: cross-validator
    current: 앵커 대비 ±15% 이상 괴리 시 경고
    issue: |
      🔴 **±15% 는 오타를 잡지 못합니다.**
      실측 사례 — 평당가가 한 면은 15,933만원, 다른 면은 1억 5,923만원이었습니다.
