meta:
  id: im.d56-lexicon
  version: 1
  source: docs/D56_KOREAN_SMALL_COMMERCIAL_REAL_ESTATE_TERMINOLOGY_DICTIONARY.md
  owner: D56
grade_system:
  official: 법령·공부·공공통계에 쓰이는 명칭
  recommended: 중개 문서에 가장 자연스러운 명칭
  conditional_expert: 투자분석·특수자산에서만 필요
  internal_only: 자료처리·AI·발행통제에 필요
  caution: 뜻이 여러개이거나 과장 가능성이 큰 명칭
  field_term: 현장어
categories:
  A:
    ko: 문서·중개업무·당사자
    question: 누가 어떤 문서를 왜 만드는가
  B:
    ko: 거래조건·가격·대금
    question: 무엇을 얼마에 어떤 조건으로 거래하는가
  C:
    ko: 대상 식별·매각범위
    question: 정확히 어느 필지와 건물이 포함되는가
  D:
    ko: 토지·도시계획·도로
    question: 토지의 법정 상태와 이용조건은 어떠한가
  E:
    ko: 건물·면적·시설
    question: 건물의 물리적·공부상 상태는 어떠한가
  F:
    ko: 소유권·담보·법적 제한
    question: 누가 어떤 권리를 가지며 무엇이 제한하는가
  G:
    ko: 임대차·점유·임대차 현황표
    question: 누가 어느 공간을 어떤 조건으로 쓰는가
  H:
    ko: 임대수입·운영비
    question: 현재 운영에서 얼마가 들어오고 나가는가
  I:
    ko: 수익률·투자지표
    question: 어떤 산식으로 경제성을 판단하는가
  J:
    ko: 입지·상권·시장·비교사례
    question: 주변 수요와 가격 근거는 무엇인가
  K:
    ko: 가치개선·개발·용도전환
    question: 무엇을 바꾸면 가치가 달라질 수 있는가
  L:
    ko: 실사·협상·계약조건
    question: 거래 전 무엇을 확인하고 조건화할 것인가
  M:
    ko: 자료출처·검증·불일치
    question: 그 말은 무엇에 근거하고 얼마나 믿을 수 있는가
  N:
    ko: 문서작성·발행·AI 운영
    question: 무엇을 어떤 상태에서 밖으로 내보낼 것인가
  O:
    ko: 특수자산·운영형 지표
    question: 일반 임대형과 다른 자산은 무엇을 추가로 보는가
terms:
- id: A001
  canonical: 매각안내서
  grade: recommended
  category: A
  synonyms:
  - OM
  - 매물소개서
  - 매각제안서
  definition: 매도 대상, 가격, 공부, 현황, 임대차, 위험요인을 정리해 초기 검토와 답사를 돕는 문서
  caution: 법정 서식인 `중개대상물 확인·설명서`를 대신하지 않음
  external_visible: true
- id: A002
  canonical: 투자검토서
  grade: recommended
  category: A
  synonyms:
  - IM
  - 투자설명서
  definition: 가격·임대수입·시장·위험·개선방안까지 연결해 매수 검토를 지원하는 문서
  caution: 증권의 투자설명서와 혼동될 수 있어 문서 첫머리에 부동산 매각자료임을 명시
  external_visible: true
- id: A003
  canonical: 요약 매각안내서
  grade: recommended
  category: A
  synonyms:
  - 티저
  - Teaser
  definition: 핵심 가격·규모·입지·임대정보만 담은 짧은 자료
  caution: 주소·임차인 정보 비공개 여부를 명시
  external_visible: true
- id: A004
  canonical: 중개대상물 확인·설명서
  grade: official
  category: A
  synonyms:
  - 확인설명서
  definition: 개업공인중개사가 법정 확인·설명사항을 적어 거래당사자에게 교부하는 서식
  caution: 매각안내서와 별개이며, 비주거용 건축물 서식을 확인
  external_visible: true
- id: A005
  canonical: 거래계약서
  grade: official
  category: A
  synonyms:
  - 매매계약서
  - 임대차계약서
  definition: 거래당사자, 물건, 금액, 지급, 인도, 권리이전, 특약 등을 정하는 문서
  caution: 초안·체결본·수정본을 구분
  external_visible: true
- id: A006
  canonical: 중개
  grade: official
  category: A
  synonyms:
  - 알선
  definition: 중개대상물의 매매·교환·임대차 등 권리의 득실변경을 거래당사자 사이에서 알선하는 행위
  caution: 감정평가·법률·세무 자문과 업무범위를 혼동하지 않음
  external_visible: true
- id: A007
  canonical: 개업공인중개사
  grade: official
  category: A
  synonyms:
  - 대표 공인중개사
  definition: 중개사무소 개설등록을 하고 중개업을 하는 자
  caution: '`중개업자`라는 구표현보다 공식 명칭 권장'
  external_visible: true
- id: A008
  canonical: 소속공인중개사
  grade: official
  category: A
  synonyms:
  - 소속 중개사
  definition: 개업공인중개사에 소속되어 중개업무를 수행하거나 보조하는 공인중개사
  caution: 중개보조원과 구분
  external_visible: true
- id: A009
  canonical: 중개보조원
  grade: official
  category: A
  synonyms:
  - 보조원
  definition: 공인중개사가 아니며 현장안내·일반서무 등 단순 업무를 보조하는 자
  caution: 확인·설명 주체로 표현하지 않음
  external_visible: true
- id: A010
  canonical: 중개의뢰인
  grade: official
  category: A
  synonyms:
  - 의뢰인
  definition: 중개를 의뢰한 매도인·매수인·임대인·임차인
  caution: 문서에서는 실제 역할을 함께 적음
  external_visible: true
- id: A011
  canonical: 매도인
  grade: official
  category: A
  synonyms:
  - 소유자
  - 매각자
  definition: 부동산을 파는 당사자
  caution: 등기상 소유자와 계약 당사자가 다르면 관계 확인
  external_visible: true
- id: A012
  canonical: 매수인
  grade: official
  category: A
  synonyms:
  - 매입자
  - 투자자
  definition: 부동산을 사는 당사자
  caution: 법인·개인·공동매수 등 주체를 구분
  external_visible: true
- id: A013
  canonical: 임대인
  grade: official
  category: A
  synonyms:
  - 건물주
  definition: 임대차 목적물을 사용·수익하게 하는 당사자
  caution: 소유자와 항상 같다고 가정하지 않음
  external_visible: true
- id: A014
  canonical: 임차인
  grade: official
  category: A
  synonyms:
  - 세입자
  - 테넌트
  definition: 차임 등을 지급하고 목적물을 사용하는 당사자
  caution: 법인명·상호·실제 점유자를 구분
  external_visible: true
- id: A015
  canonical: 매각주관
  grade: recommended
  category: A
  synonyms:
  - 주관사
  definition: 매각자료·마케팅·질의·협상을 총괄하는 역할
  caution: 독점권한 여부와 기간은 계약으로 확인
  external_visible: true
- id: A016
  canonical: 공동중개
  grade: official
  category: A
  synonyms:
  - 코브로커리지
  definition: 둘 이상의 중개사무소가 공동으로 중개하는 방식
  caution: 역할, 고객귀속, 보수배분을 사전 합의
  external_visible: true
- id: A017
  canonical: 전속중개계약
  grade: official
  category: A
  synonyms:
  - 전속매각
  definition: 중개의뢰인이 정한 기간 동안 특정 개업공인중개사에게 전속으로 중개를 맡기는 계약
  caution: 구두 전속 표현보다 서면계약 확인
  external_visible: true
- id: A018
  canonical: 일반중개계약
  grade: official
  category: A
  synonyms:
  - 일반매물
  definition: 복수 중개업자에게 의뢰할 수 있는 일반적인 중개계약
  caution: 거래예정금액과 의뢰조건의 최신성 확인
  external_visible: true
- id: A019
  canonical: 비밀유지약정
  grade: recommended
  category: A
  synonyms:
  - NDA
  definition: 비공개 자료의 사용·공유 범위를 정하는 약정
  caution: 임차인 개인정보, 계약서, 세무자료 제공 전에 체결 검토
  external_visible: true
- id: A020
  canonical: 자료수령 확인서
  grade: recommended
  category: A
  synonyms:
  - 자료목록
  definition: 매도인·중개인·전문가가 제공한 자료명과 기준일을 기록한 목록
  caution: '`검증 완료`를 뜻하지 않음'
  external_visible: true
- id: B001
  canonical: 매도 희망가
  grade: recommended
  category: B
  synonyms:
  - 호가
  - 매매가
  - Asking Price
  definition: 매도인이 제시하는 희망 매각금액
  caution: '`시세`·`가치`·`계약금액`처럼 쓰지 않음'
  external_visible: true
- id: B002
  canonical: 협의가격
  grade: recommended
  category: B
  synonyms:
  - 가격협의
  - 네고 가능
  definition: 매도 희망가가 고정되지 않고 협의 대상임을 뜻함
  caution: 가격이 없다는 뜻인지, 일정 범위 내 조정인지 설명
  external_visible: true
- id: B003
  canonical: 제안가격
  grade: recommended
  category: B
  synonyms:
  - 오퍼가
  - 매입희망가
  definition: 매수인이 제안한 매입금액
  caution: 제안일·유효기간·전제조건을 함께 기록
  external_visible: true
- id: B004
  canonical: 계약금액
  grade: official
  category: B
  synonyms:
  - 매매대금
  definition: 당사자가 계약서에서 합의한 전체 거래금액
  caution: 부가가치세·시설·영업양수도 대금 포함 여부 구분
  external_visible: true
- id: B005
  canonical: 실거래 신고금액
  grade: official
  category: B
  synonyms:
  - 실거래가
  definition: 부동산 거래신고에 따라 신고·공개된 금액
  caution: 공개시스템 자료는 변경·해제될 수 있으며 감정가나 현 시세가 아님
  external_visible: true
- id: B006
  canonical: 감정평가액
  grade: official
  category: B
  synonyms:
  - 감정가
  definition: 감정평가법인 등이 기준시점과 목적에 따라 평가한 가액
  caution: 평가목적·기준시점·평가조건을 함께 적음
  external_visible: true
- id: B007
  canonical: 추정가치
  grade: conditional_expert
  category: B
  synonyms:
  - 예상가치
  - 가치추정
  definition: 명시한 방법과 가정으로 산출한 분석상 가치
  caution: 공인 감정평가 결과처럼 표현하지 않음
  external_visible: true
- id: B008
  canonical: 토지가격
  grade: recommended
  category: B
  synonyms:
  - 땅값
  definition: 거래금액 중 토지에 관한 가격 또는 토지 비교가격
  caution: 건물 포함 총액과 구분; 산정근거 표시
  external_visible: true
- id: B009
  canonical: 건물가격
  grade: recommended
  category: B
  synonyms:
  - 건물분
  definition: 거래금액 중 건물에 배분한 가격
  caution: 세무상 배분과 경제적 가치배분이 다를 수 있음
  external_visible: true
- id: B010
  canonical: 부가가치세 별도
  grade: official
  category: B
  synonyms:
  - 부가세 별도
  definition: 건물분 등에 대한 부가가치세가 표시금액에 포함되지 않았다는 뜻
  caution: 과세대상·안분·포괄양수도 여부는 세무전문가 확인
  external_visible: true
- id: B011
  canonical: 계약금
  grade: official
  category: B
  synonyms:
  - 계약보증금
  definition: 계약 체결 때 지급하는 금액
  caution: 임대차보증금과 구분
  external_visible: true
- id: B012
  canonical: 중도금
  grade: official
  category: B
  synonyms:
  - 2차 대금
  definition: 계약금과 잔금 사이에 지급하는 금액
  caution: 지급조건과 권리변동 조건을 함께 적음
  external_visible: true
- id: B013
  canonical: 잔금
  grade: official
  category: B
  synonyms:
  - 잔대금
  definition: 최종 소유권 이전·인도와 연계하여 지급하는 나머지 대금
  caution: 잔금일과 인도일이 같은지 확인
  external_visible: true
- id: B014
  canonical: 거래예정금액
  grade: official
  category: B
  synonyms:
  - 예정가
  definition: 중개계약·확인설명 단계에서 예정한 거래금액
  caution: 최종 계약금액과 다를 수 있음
  external_visible: true
- id: B015
  canonical: 평당 매도 희망가
  grade: recommended
  category: B
  synonyms:
  - 평당가
  definition: 매도 희망가를 특정 면적의 평수로 나눈 값
  caution: 반드시 분모를 `토지 3.3㎡당` 또는 `연면적 3.3㎡당`으로 표시
  external_visible: true
- id: B016
  canonical: 토지 3.3㎡당 가격
  grade: recommended
  category: B
  synonyms:
  - 대지가
  definition: 가격 ÷ 토지면적(평)
  caution: 여러 필지면 포함 필지 전체 면적 기준인지 명시
  external_visible: true
- id: B017
  canonical: 연면적 3.3㎡당 가격
  grade: recommended
  category: B
  synonyms:
  - 연면적 평당가
  definition: 가격 ÷ 연면적(평)
  caution: 공부상 연면적인지 실사용 추정면적인지 명시
  external_visible: true
- id: B018
  canonical: 매각조건
  grade: recommended
  category: B
  synonyms:
  - 딜 조건
  definition: 가격 외 인도·명도·임대차 승계·시설 포함 등을 아우르는 조건
  caution: 한 문장으로 뭉뚱그리지 말고 항목별 표기
  external_visible: true
- id: B019
  canonical: 현 상태 인도
  grade: recommended
  category: B
  synonyms:
  - As-is
  definition: 계약 시 합의한 현재 상태로 인도하는 조건
  caution: 하자·위반·잔존물에 대한 책임까지 자동 면제되는 것은 아님
  external_visible: true
- id: B020
  canonical: 임대차 승계
  grade: recommended
  category: B
  synonyms:
  - 세입자 승계
  definition: 매수인이 기존 임대인의 지위와 임대차관계를 이어받는 구조
  caution: 보증금 반환채무·연체·분쟁·특약 확인
  external_visible: true
- id: B021
  canonical: 명도조건부 매매
  grade: recommended
  category: B
  synonyms:
  - 명도 매매
  definition: 특정 점유자를 퇴거시키거나 공간을 비워 인도하는 것을 조건으로 하는 매매
  caution: 명도 주체·기한·비용·미이행 책임을 특약화
  external_visible: true
- id: B022
  canonical: 포괄양수도
  grade: conditional_expert
  category: B
  synonyms:
  - 사업양수도
