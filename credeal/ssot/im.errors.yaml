meta:
  id: im.errors
  version: 1
  owner: CATALOG_RULES.md (코드 공간 정본) · 이 파일은 기계 판독 사본 + 신설 등록 요청
  note: |
    CATALOG_RULES.md 는 "코드 신설·폐기는 반드시 이 문서에 먼저 등록합니다" 와
    "코드 재사용 금지 — 폐기된 코드를 다른 의미로 다시 쓰면 과거 IM의 해석이
    사후에 바뀝니다" 를 규정합니다. **그 규정이 세 번 지켜지지 않았습니다.**
    이 파일은 충돌을 드러내고 해소안을 제시합니다. CATALOG 반영 전까지
    `status: 등록요청` 인 코드는 사용하지 않습니다.

# ── 코드군 소유 ────────────────────────────────────────────────────────
namespaces:
  - prefix: R
    label: Archetype — 이 물건은 어떤 유형인가
    owner: CATALOG_RULES.md §1
    scheme: R-{POSTURE}-{nn}
  - prefix: T-C / T-R
    label: Tenancy — 임대차의 법적 지위
    owner: CATALOG_RULES.md §2
  - prefix: P
    label: Parcel — 토지의 유효 규모
    owner: CATALOG_RULES.md §3
  - prefix: C
    label: Constraint — 데이터가 정합한가
    owner: CATALOG_RULES.md §3
    range: C01~C32 (사용 중) · C33~ 확장 가능
  - prefix: G
    label: Gate — 발행해도 되는가
    owner: CATALOG_RULES.md §4
    range: G01~G16 (등록) · G17~G24 등록요청
  - prefix: L
    label: Layout — 어떤 슬라이드를 편성할까
    owner: CATALOG_RULES.md §5
  - prefix: M
    label: NLG Mask — 어떻게 문장으로 쓸까
    owner: CATALOG_RULES.md §6
  - prefix: F
    label: Freshness — 발행 후 낡았는가
    owner: POST_PUBLISH_SPEC.md §2
    range: F01~F10
    warning: 🔴 D19·D20 이 같은 접두를 기능요구 코드로 썼습니다 — conflicts C3
  - prefix: S
    label: Signal — 매수자 반응이 무엇을 말하는가
    owner: POST_PUBLISH_SPEC.md §3
  - prefix: X
    label: Crosscheck — 공부값끼리 검산이 맞는가
    owner: 이 파일 (등록요청)
    range: X01~X04
    status: 등록요청
    rationale: |
      C 는 "받은 데이터가 규칙에 맞는가"를 봅니다.
      X 는 "받은 데이터끼리 계산이 맞는가"를 봅니다.
      전자는 단일 값 판정, 후자는 값 사이의 항등식 판정으로 성격이 다릅니다.
      C 에 흡수하면 허용오차·해소 경로가 뒤섞입니다.
  - prefix: FR
    label: Functional Requirement — 무엇을 만들 것인가
    owner: CREDEAL_IM_SPEC_수익형.md §9 · PPTX_시스템_개선_요구서.md
    range: FR01~FR22
    status: 등록요청
    note: 규칙 코드가 아니라 개발 항목입니다. 판정 로직 카탈로그와 공간을 나눕니다

# ── 🔴 충돌 4건 ────────────────────────────────────────────────────────
conflicts:
  - id: C1
    code: C19
    severity: 차단
    a:
      source: CATALOG_RULES.md §3
      meaning: Σ 층별 바닥면적 = 연면적
      tolerance_pct: 0.5
      level: 경고
    b:
      source: IM_SYSTEM_SSOT.md §11 · CREDEAL_IM_SPEC_수익형.md
      meaning: 임대면적 합 = 표기 연면적
      tolerance_pct: 2.0
      level: 차단
    impact: |
      같은 코드가 서로 다른 검사를, 서로 다른 허용오차로, 서로 다른 심각도로
      판정합니다. 로그에 'C19 실패'만 남으면 무엇이 틀렸는지 알 수 없습니다.
      더 나쁘게는 A 가 경고인데 B 가 차단이므로 **어느 구현을 쓰느냐로 발행
      가부가 갈립니다.**
    resolution:
      keep: C19 = CATALOG 정의 (층별 바닥면적 합 = 연면적 · ±0.5% · 경고)
      rename: 임대면적 검사를 C33 으로 신설
      migrate: 기존 로그·문서의 'C19(임대면적)' 표기를 C33 으로 일괄 치환
  - id: C2
    code: G13
    severity: 중대
    a:
      source: CATALOG_RULES.md §4
      meaning: 적용 법령별 임대차 판정 정합 · opposingPower=false 에 근거 존재
    b:
      source: IM_SYSTEM_SSOT.md
      meaning: 대항력 근거 없이 "없음" 표기
    impact: B 는 A 의 후반부와 같은 검사입니다. 두 문서가 각자 서술했습니다
    resolution:
      keep: G13 = CATALOG 정의 (B 를 포함합니다)
      action: IM_SYSTEM_SSOT.md 의 G13 행을 CATALOG 참조로 대체
  - id: C3
    code: F
    severity: 차단
    a:
      source: POST_PUBLISH_SPEC.md §2
      meaning: Freshness — 발행 후 낡았는가 (F01~F10)
    b:
      source: CREDEAL_IM_SPEC_수익형.md §9
      meaning: 기능 요구 (F1~F10)
    c:
      source: PPTX_시스템_개선_요구서.md
      meaning: 기능 요구 (F11~F22)
    d:
      source: im.invariants.yaml v1 (이 세션)
      meaning: 계약 만료 게이트 (F11~F13)
    impact: |
      **4중 충돌입니다.** "F12 실패"가 만료 비율 50% 초과인지, PPTX 블록
      게이팅 미구현인지, 발행 후 신선도 항목인지 구분되지 않습니다.
      D 는 제가 이번 세션에 만든 것이므로 제 잘못입니다.
    resolution:
      keep: F01~F10 = Freshness (POST_PUBLISH_SPEC 소유)
      rename_b_c: 기능 요구를 FR01~FR22 로 개명
      rename_d: 만료 게이트를 G22·G23·G24 로 이관 (게이트 성격)
  - id: C4
    code: G17 G18 G19 G21
    severity: 중대
    detail: CATALOG 의 G 범위는 G01~G16 입니다. G17 이후는 미등록 코드입니다
    impact: 카탈로그에 없는 코드가 산출물과 로그에 나타납니다. 사후 추적 불가
    resolution:
      action: 번호를 유지한 채 CATALOG §4 에 정식 등록 (이미 IM·로그에 남아 있어 개명 비용이 큼)
      register: [G17, G18, G19, G20, G21, G22, G23, G24]

