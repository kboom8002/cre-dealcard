# 이 파일은 build_ssot.py 가 생성합니다. 손으로 고치지 마십시오.
# 정본 코드: credeal/input_spec.py · credeal/presets.py
meta:
  id: im.gating
  version: 1
  owner: credeal/input_spec.py (생성본)
  fields: 49
  blocks: 51
tiers:
  required: 필수
  recommended: 권장
  optional: 선택
source_grades:
  S1: 공부
  S2a: 공공 API 원시
  S2b: 공공 API + 중개인 보강
  S3: 중개인 입력
  S5: 가정
axes:
  L:
    label: 임대차 해상도
    levels:
      R1:
        - rr_unit
        - rr_business
        - rr_deposit
        - rr_rent
        - rr_expiry
        - rr_state
      R2:
        - rr_area
        - rr_legal
        - rr_mgmt
        - rr_start
      R3:
        - rr_first
        - rr_opposing
  P:
    label: 물건자료 해상도
    levels:
      P1:
        - address_jibun
      P2:
        - land_sqm
        - gfa_sqm
        - zoning
        - land_price_sqm
      P3:
        - comp_identify
        - comp_land_sqm
        - photo_ext
grade_map:
  - grade: A
    when: L>=R2 and P>=P2
    deck: 풀 기관투자 덱
  - grade: B
    when: L>=R1 and P>=P2
    deck: 공공 결합 표준 덱
  - grade: C
    when: L>=R1 and P==P1
    deck: 원장 기반 덱
  - grade: D
    when: L==R0 or P==P0
    deck: 최소 덱 · 내부 검토용
public_auto:
  land_sqm: S1
  arch_sqm: S1
  gfa_sqm: S1
  bcr: S1
  far: S1
  main_use: S1
  structure: S1
  floors: S1
  approval_date: S1
  elevator: S1
  parking: S1
  violation: S1
  floor_table: S1
  zoning: S2a
  zoning_overlap: S2a
  bcr_limit: S2a
  far_limit: S2a
  land_price_sqm: S2a
  transit: S2a
  district: S2a
  comps_raw: S2a
fields:
