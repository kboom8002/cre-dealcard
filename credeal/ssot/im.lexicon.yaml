corrections:
- before: 우수한 투자 물건을 찾으시는 분에게 적극 추천 드립니다
  after: 검토 후 문의 주시면 상세 자료를 보내드리겠습니다
- before: 유지보수 비용 Zero
  after: 2018년 준공 · 주요 수선 이력 미확인
- before: 우량 임차인
  after: 병원·약국 등 생활밀착 업종
- before: 입지 불패
  after: 당산역 도보 5분 · 배후 아파트 밀집
- before: 퇴거 리스크 완벽 헤징
  after: 6개 호실 분산 임차
- before: 매매가 50억원
  after: 매도 희망가 50억원
  reason: 호가·제안가·계약가가 구분되지 않음
- before: 실거래가
  after: 국토교통부 공개시스템 실거래 신고금액, 계약일 2026-05-12, 조회일 2026-08-30
  reason: 신고자료·계약서 확인값·주변 거래사례가 섞임
- before: 시세 60억원
  after: 선정한 실거래사례 3건의 토지 3.3㎡당 가격 범위는 ○○~○○만원
  reason: 조사범위·시점·근거가 없음
- before: 평당 1억원
  after: 토지면적 기준 3.3㎡당 매도 희망가 1억원
  reason: 토지·연면적·전용면적 중 분모가 없음
- before: 면적 100평
  after: 공부상 토지면적 330.58㎡(100.0평)
  reason: 토지·연면적·임대면적이 구분되지 않음
- before: 실평수 50평
  after: 임대차계약서상 전용면적 165.29㎡(50.0평) 또는 현장 추정 실사용면적
  reason: 실측·전용·임대면적이 섞임
- before: 임대료 1,000만원
  after: 월 기본임대료 1,000만원, 관리비 100만원, 부가가치세 별도
  reason: 관리비·부가세 포함 여부가 없음
- before: 월수입 1,100만원
  after: 월 임대수입 합계 1,100만원 = 기본임대료 1,000만원 + 정액관리비 100만원
  reason: 무엇을 합산했는지 알 수 없음
- before: 수익률 3.0%
  after: 매도 희망가 기준 단순 임대수익률 2.40% = 연 기본임대료 1.2억원 ÷ 50억원
  reason: 분자·분모·비용·보증금 처리 불명
- before: 순수익률
  after: 순영업소득 기준 자본환원율 등 정확한 지표로 교체
  reason: 운영비·세금·금융비용 범위가 불명
- before: 만실
  after: 2026-08-30 기준 임대가능면적 전부 계약 중; 2층 실제 입점 여부는 미확인
  reason: 공간 범위와 기준일이 없음
- before: 장기 임차
  after: 기준일 현재 잔여 임대차기간 4년 7개월
  reason: 남은 기간이 없음
- before: 시세보다 저렴
  after: 선정한 매물사례의 토지 3.3㎡당 호가 중앙값보다 8% 낮음; 사례는 미계약 호가임
  reason: 비교방법·차이원인이 없음
- before: 역세권
  after: ○○역 3번 출구에서 보행경로 약 420m(지도 기준)
  reason: 거리·동선이 없음
- before: 대로변
  after: 폭 약 25m ○○로에 접함(토지이용계획·지도 확인)
  reason: 도로명·폭·접면이 없음
- before: 코너
  after: 남측 ○m 도로와 동측 ○m 도로가 만나는 모서리 필지
  reason: 어느 도로와 접하는지 없음
- before: 가시성 우수
  after: 동측 도로 차량 진행방향에서 건물 전면이 약 ○m 전부터 확인됨(현장사진 07)
  reason: 관찰 근거가 없음
- before: 개발 가능
  after: 토지이용계획상 제2종일반주거지역; 구체적 개발규모는 건축사 검토 필요
  reason: 인허가·도로·규제 검토가 없음
- before: 증축 가능
  after: 현황 용적률과 법정 상한 사이 차이는 있으나 증축 가능 여부는 구조·주차·인허가 미검토
  reason: 용적률 외 구조·주차·피난을 누락
- before: 용적률이 남음
  after: 법정 상한 대비 수치상 차이 ○%p; 실제 활용 가능성 미판정
  reason: 단순 차이가 실제 가능면적으로 오해됨
- before: 불법건축물
  after: 건축물대장과 현장 형태 불일치—무단증축 여부 추가 확인 필요
  reason: 확인 전 법 위반을 단정
- before: 위반 없음
  after: 발급일 현재 건축물대장 위반건축물 표시 없음; 현장·인허가 전체 적합성은 미확인
  reason: 대장 미표시만으로 모든 위반이 없다고 단정
- before: 대출 ○억원
  after: 등기상 채권최고액 ○억원; 실제 잔액은 별도 자료 확인
  reason: 채권최고액을 실제 채무로 오인
- before: 권리 깨끗함
  after: 등기상 가압류·압류 없음(발급일 기준); 임대차·체납은 별도 실사 필요
  reason: 등기 외 임대차·점유·체납을 누락
- before: 명도 가능
  after: 매도인 진술상 잔금 전 명도 협의 예정; 합의서 미제공
  reason: 상대방·기간·비용이 불확실
- before: 리모델링 완료
  after: 2024년 외벽·공용계단·화장실 공사(매도인 제공 견적서 기준)
  reason: 공사범위·시점·허가가 없음
- before: 리뉴얼
  after: 외관개선, 공용부 개선, 임대차 재정비 중 구체적 용어 사용
  reason: 외관·임대·브랜드·공사 의미가 섞임
- before: 밸류애드
  after: '가치개선안: 3층 공실 해소 + 공용부 개선; 비용·기간·수입효과 분리'
  reason: 무엇을 언제 얼마에 바꾸는지 없음
- before: 엑시트
  after: 5년 보유 후 매각가정
