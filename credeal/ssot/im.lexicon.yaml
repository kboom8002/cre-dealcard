meta:
  id: im.lexicon
  version: 1
  owner: CATALOG_LEXICON.md §7~§8 + D56 (정본)
  moved_from: IM_STANDARD_수익형.md §6 — v0.5에서 온톨로지로 승격
  note: 'md 표에만 있던 어휘 규칙을 기계 판독 정본으로 승격했습니다.

    문서와 코드가 각자 목록을 갖고 있으면 반드시 어긋납니다.

    검사기·생성기·프롬프트가 모두 이 파일 하나만 읽습니다.

    '
