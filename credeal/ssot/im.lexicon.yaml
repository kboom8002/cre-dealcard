meta:
  id: im.lexicon
  version: 1
  owner: CATALOG_LEXICON.md §7~§8 (정본)
  moved_from: IM_STANDARD_수익형.md §6 — v0.5에서 온톨로지로 승격
  note: |
    md 표에만 있던 어휘 규칙을 기계 판독 정본으로 승격했습니다.
    문서와 코드가 각자 목록을 갖고 있으면 반드시 어긋납니다.
    검사기·생성기·프롬프트가 모두 이 파일 하나만 읽습니다.

# ── 치환 사전 — 왼쪽을 쓰지 않습니다 (정본 §6.1) ────────────────────────
substitutions:
  - from: Cap Rate
    to: 연 수익률
    require: 기준 병기
    reason: 분모가 여럿인데 하나로 읽힙니다
  - from: NOI
    to: 연 순수입
  - from: CapEx
    to: 추가 공사비
  - from: 리스업
    to: 공실 임대
  - from: 밸류애드
    to: 가치 상승 여력
  - from: 테넌트
    to: 임차인
  - from: 렌트롤
    to: 임대 현황
  - from: 코어
    to: null
    reason: 쓰지 않습니다
  - from: 오퍼튜니스틱
    to: null
  - from: 포스처
    to: null
    reason: 내부 용어 — 화면에 노출하지 않습니다
  - from: 초역세권
    to: 역 도보 N분
  - from: 랜드마크
    to: null
  - from: 스탠다드
    to: null
  - from: 프리미엄
    to: null
    scope: 등급 표현으로 쓸 때만
    reason: 프리미엄 입지는 금지 · 시세 대비 프리미엄은 허용

# ── 그대로 쓰는 용어 (정본 §6.2) ───────────────────────────────────────
keep_as_is:
  - 용적률
  - 건폐율
  - 연면적
  - 대지면적
  - 환산보증금
  - 갱신요구권
  - 근저당
  - 공시지가
  - 준공업지역
  - 구분등기
  - 대항력
  - 명도
  - 실투자금
  - 총취득원가

# ── 금지어 (정본 §6.3) ─────────────────────────────────────────────────
banned:
  absolute:   [Zero, 제로, 완벽, 무결점, 영구적, 불패, 100%, 전혀 없음]
  ungrounded: [우량, 최고, 독보적, 유일, 극대화, 초안정, 희소성]
  advertising: [적극 추천, 놓치면 후회, 강력 추천, 서두르]
  verdict:    [리스크 없음, 안전 보장, 확실한 수익, 확정적]
  hype:       [초역세권, 급행, 보장]        # 정본 §6.1 치환 대상이나 검사기에서는 금지어로 함께 판정

# 더 긴 낱말 안에 우연히 포함된 경우는 위반이 아닙니다
# 문맥 예외 — 11키 중 5키(유일·완벽·독보적·희소성·확정적)는 **빈 목록**입니다.
# 예외가 필요한 문맥이 아직 관측되지 않았다는 뜻이고, 실효 예외는 6키입니다.
# 키를 지우지 않는 이유 — 나중에 관측되면 여기에 붙입니다.
context_exclude:
  제로: [실제로, 전제로, 대전제로, 영점제로]
  최고: [채권최고액, 최고액, 최고치, 최고점, 최고층, 최고고도, 최고높이]   # 채권최고액·가로구역별 최고높이 = 법정 용어
  보장: [보장성, 보장금액]
  우량: [우량주]
  유일: []
  100%: [만실 100%]
  완벽: []
  독보적: []
  희소성: []
  급행: [급행 정차, 급행 정차역]           # 노선 사실은 위반이 아닙니다
  확정적: []

# 부정문 안의 금지어는 위반이 아닙니다
negation_markers:
  - 쓰지 않
  - 붙이지 않
  - 적지 않
  - 기재하지 않
  - 판정하지 않
  - 산출하지 않
  - 넣지 않
  - 않습니다
  - 않았습니다
  - 않아
  - 없습니다
  - 아닙니다
  - 해서는 안
  - 금합니다
  - 금지

# ── 교정 예 (정본 §6.3) ────────────────────────────────────────────────
corrections:
  - before: 우수한 투자 물건을 찾으시는 분에게 적극 추천 드립니다
    after: 검토 후 문의 주시면 상세 자료를 보내드리겠습니다
  - before: 유지보수 비용 Zero
    after: 2018년 준공 · 주요 수선 이력 미확인
  - before: 우량 임차인
    after: 병원·약국 등 생활밀착 업종
  - before: 입지 불패
    after: 당산역 도보 5분 · 배후 아파트 밀집
  - before: 퇴거 리스크 완벽 헤징
    after: 6개 호실 분산 임차
