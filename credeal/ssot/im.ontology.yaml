      개발형 IM 을 쓸 때 "우량"·"확정적" 을 금지할 근거가 없습니다.
      지금 CATALOG_LEXICON 은 라벨·alias 만 소유하고 금지어는 0건입니다.
  - what: 출처 등급 6단 (S1·S2a·S2b·S3·S4·S5)
    now: D19 §1 (구현 규격)
    should: CATALOG_SLOTS Provenance enum (온톨로지)
    why: 등급은 포스처와 무관합니다. 운영 5종과도 어긋나 있습니다
  - what: 불변조건 21
    now: IM_SYSTEM_SSOT §11
    should: 유지 — 다만 포스처 의존 여부를 항목마다 표시해야 합니다
    why: |
      불변조건 1(운영비 없이 NOI 금지)은 수익형·운영형에만 걸립니다.
      개발형에는 NOI 자체가 없습니다. 지금은 구분이 없습니다

# ── 보완 8건 ───────────────────────────────────────────────────────────
upgrades:
  - id: O1
    title: 폐기 문서를 소유자로 지목한 참조를 회수합니다
    severity: 차단
    status: 반영
    measured:
      owning_refs: 3
      detail:
        - CATALOG_SLOTS.md:4 → IM_PRECISION_SPEC (계산식)
        - CATALOG_SLOTS.md:4 → ONTOLOGY_V0.3_SPEC (구조·원칙)
        - CATALOG_RULES.md:4 → IM_PRECISION_SPEC (계산식)
      other_refs: 31
      superseded_docs: 8
    why: |
      🔴 **D22-8 사고의 구조적 원인이 아직 살아 있습니다.**
      살아 있는 정본이 폐기 문서를 규칙의 주인으로 가리킵니다.
      슬롯 정의(exclusions)는 살아 있는데 그 값으로 무엇을 계산하는지는
      폐기 문서에만 있었고, 그래서 다필지·제척이 통째로 유실됐습니다.
    action:
      - IM_PRECISION_SPEC 의 계산식을 CATALOG_RULES §3(P 코드군)으로 회수
      - ONTOLOGY_V0.3_SPEC 참조를 V0.4 로 갱신
      - 나머지 31건은 "참고" 로 문언을 바꿔 소유와 구분
    verify: qa/ontology_check.py ① — 소유 지목 0건

  - id: O2
    title: CATALOG_SLOTS 를 v0.3 에서 v0.4 로 올립니다
    severity: 차단
    status: 반영
    measured:
      slots_version: v0.3.0
      rules_version: v0.4
      matrix_axis: AssetClass (폐기된 축)
      missing_columns: [operating, trading]
    why: |
      🔴 슬롯 매트릭스가 **폐기된 축**으로 그려져 있습니다.
      열이 income·owner_occupied·development·land·logistics 인데
      land·logistics 는 assetType 으로 이동했고, operating·trading 은
      열 자체가 없습니다. **포스처 2종은 필수 슬롯이 정의된 적이 없습니다.**
    action:
      - 매트릭스 축을 investmentPosture 5종으로 교체
      - operating · trading 열 신설
      - 헤더 "Core 8" 을 실측 9 로 정정
      - Pack 3종 정의 추가 — residential_spec · sectional_spec · hospitality_spec

  - id: O3
    title: 어휘 규칙을 CATALOG_LEXICON 으로 승격합니다
    severity: 중대
    status: 반영
    measured:
      lexicon_banned_words: 0
      standard_banned_words: 26
      standard_substitutions: 14
    why: |
      포스처 무관 규칙이 수익형 전용 문서에 있습니다. 개발형·운영형 IM 을
      쓸 때 같은 규칙을 적용할 근거가 없고, 결국 문서마다 목록이 하나씩
      생깁니다 — 검사기 두 개의 금지어 교집합이 8/26 이었던 것과 같은 병입니다.
    action:
      - CATALOG_LEXICON 에 banned · substitutions · context_exclude · negation 신설
      - IM_STANDARD_수익형 §6 은 "CATALOG_LEXICON 이 소유" 로 참조 전환
      - credeal/ssot/im.lexicon.yaml 의 owner 를 CATALOG_LEXICON 으로 변경
    keep: 표기 규칙(금액 단위·퍼센트 basis·면적 병기)도 함께 올립니다

  - id: O4
    title: 코드군 선언과 실측을 맞춥니다
    severity: 중대
    status: 반영
    measured:
      - {group: R, declared: 없음, titled: 없음, actual: 23, empty: 2}
      - {group: C, declared: 32, titled: 28, actual: 32, empty: 8}
      - {group: G, declared: 16, titled: 14, actual: 14, empty: 0}
      - {group: L, declared: 24, titled: 20, actual: 24, empty: 0}
      - {group: M, declared: 24, titled: 24, actual: 20, empty: 2}
    why: |
      선언·절 제목·실측이 세 값으로 갈립니다. **개수를 못 믿으면
      "다 있는가" 를 확인할 방법이 없습니다.** 공란 12건은 정의가
      `[v0.1 원본 확인 필요]` 로만 남아 있어 구현할 수 없습니다.
    action:
      - 헤더 표·절 제목·실제 나열을 한 값으로 통일
      - 공란 12건에 정의를 채우거나 **명시적으로 폐기** — 결번으로 두지 않습니다
      - R 코드군 개수를 헤더 표에 등록 (지금 없습니다)
      - R-LND·R-LOG 는 흡수를 선언했으니 취소선 처리

  - id: O5
    title: G 코드 자릿수를 두 자리로 통일합니다
    severity: 중대
    status: 반영
    measured: {catalog: G1~G16 (1자리), registry: G01~G26 (2자리)}
    why: |
      🔴 `G1` 과 `G01` 이 섞이면 **로그 검색이 갈립니다.**
      "G1 실패" 로 grep 하면 G10~G16 이 함께 걸리고, "G01" 로 grep 하면
      CATALOG 쪽이 안 걸립니다.
    action: CATALOG_RULES 의 G1~G9 를 G01~G09 로 개명 · 마이그레이션 매핑 등록

  - id: O6
    title: 포스처 조건 게이트를 신설합니다
    severity: 중대
    status: 반영
    measured: {posture_conditional_gates: 0}
    why: |
      🔴 게이트 16종 중 **포스처를 조건으로 하는 것이 하나도 없습니다.**
      불변조건 1(운영비 없이 NOI 금지)은 수익형·운영형에만 걸리는데
      게이트에는 그 구분이 없어 개발형에서도 같은 검사가 돕니다.
    action:
      - '게이트마다 `applies_to: [posture…]` 를 답니다'
      - '전 포스처 공통이면 `applies_to: all`'
      - '포스처 전용 게이트가 필요하면 신설 — 예: 개발형 인허가 리스크'
    example:
      - {code: G10, label: 수익률에 basis, applies_to: [income, operating, trading]}
      - {code: G12, label: 제척 합계 검증, applies_to: all}
      - {code: G22~G24, label: 만료 게이트, applies_to: [income, operating]}

  - id: O7
    title: R-OPR · R-TRD 아키타입을 정의합니다
    severity: 중대
    status: 반영
    measured:
      income: 11
      owner_occupied: 4
      development: 4
      operating: 0
      trading: 0
    why: |
      🔴 **포스처 2종은 아키타입이 0건입니다.** 아키타입이 없으면
      L02(아키타입별 편성)가 돌지 않고, 서사 톤을 고를 근거가 없습니다.
      모바일 IM 쪽에는 `OP-01`·`TR-01` 이 하나씩 있는데 CATALOG 에
      등록되지 않았습니다 — 또 다른 코드 공간 이탈입니다.
    action:
      - 운영형 R-OPR-01~04 · 트레이딩 R-TRD-01~04 정의
      - 모바일 `archetype-registry.ts` 의 OP-01·TR-01 을 CATALOG 로 이관
      - 실증 딜이 0건이므로 **가설임을 명시** — 데이터가 쌓이면 재정의

  - id: O8
    title: 신규 IM 규격을 온톨로지 코드로 등록합니다
    severity: 중대
    status: 반영
    why: D19 v2.2 · D22 세트가 만든 코드가 CATALOG 에 없습니다
    register:
      gates: [G17, G18, G19, G20, G21, G22, G23, G24, G26]
      constraints: [C33, C34]
      crosschecks: [X01, X02, X03, X04, X05]
      namespaces: [X (교차검증), FR (기능요구)]
      retired: [G25]
      renames:
        - {from: C19(임대면적), to: C33}
        - {from: F1~F22(기능요구), to: FR01~FR36}
        - {from: F11~F13(만료), to: G22~G24}
    note: im.errors.yaml 이 이미 매핑을 들고 있습니다. CATALOG 등록 PR 만 남았습니다

# ── 포스처 확장 계약 ───────────────────────────────────────────────────
# 새 포스처를 붙이거나 기존 포스처를 상용화할 때 **전부 채워야** 합니다.
# 하나라도 비면 그 포스처는 "내부 검토용" 입니다.
posture_contract:
  # 🔴 ONTOLOGY_V0.5_SPEC §3.1 이 정본입니다. 이 목록은 기계 판독 사본이며
  #    어긋나면 §3.1 이 이깁니다. `pages` 는 계약 13칸이 **아닙니다** —
  #    im.pages.yaml 소관이고, 포스처별 면 순서는 아직 수익형만 있습니다.
  owner: ONTOLOGY_V0.5_SPEC.md §3.1
  required:
    - {key: archetypes, owner: CATALOG_RULES §1, min: 3, note: 실증 딜이 없으면 가설로 표시}
    - {key: sections, owner: 포스처 표준, min: 7}
    - {key: emphasisSections, owner: 동일, min: 2, note: 토큰 예산 2배}
    - {key: requiredSlots, owner: CATALOG_SLOTS §4 매트릭스}
    - {key: valueMetric, owner: CATALOG_ASSET_TYPES §3}
    - {key: yieldBasis, owner: CATALOG_LEXICON §2.3, note: 없으면 none 을 명시}
    - {key: lAxisSlots, owner: ONTOLOGY_V0.5_SPEC §6.2, min: 1,
       note: CATALOG_SLOTS 에 실재하는 슬롯군 키만}
    - {key: minResolution, owner: ONTOLOGY_V0.5_SPEC §6.4}
    - {key: gradeAdjustment, owner: ONTOLOGY_V0.5_SPEC §6.5}
    - {key: layoutRules, owner: CATALOG_RULES §5, min: 1}
    - {key: constraints, owner: CATALOG_RULES §3, min: 1}
    - {key: gates, owner: CATALOG_RULES §4 applies_to}
    - {key: nlgMasks, owner: CATALOG_RULES §6, min: 2}

  # v0.4 시점 (보완 전)
  coverage_v04:
    income:         {archetypes: 11, layout: 0, constraints: 0, gates: 0, standard: true}
    owner_occupied: {archetypes: 4, layout: 1, constraints: 1, gates: 0, standard: false}
    development:    {archetypes: 4, layout: 1, constraints: 2, gates: 0, standard: false}
    operating:      {archetypes: 0, layout: 1, constraints: 1, gates: 0, standard: false}
    trading:        {archetypes: 0, layout: 0, constraints: 0, gates: 0, standard: false}

  # v0.5 + 인계 세트 반영 후 — qa/doc_integrity.py ④ · qa/ontology_check.py ③ 실측
  current_coverage:
    income:         {archetypes: 9, layout: 1, constraints: 7, gates: 10, standard: true,
                     contract: 13, status: commercial}
    owner_occupied: {archetypes: 4, layout: 1, constraints: 1, gates: 2, standard: true,
                     contract: 13, status: beta}
    development:    {archetypes: 4, layout: 1, constraints: 5, gates: 3, standard: true,
                     contract: 13, status: beta}
    operating:      {archetypes: 4, layout: 1, constraints: 7, gates: 10, standard: true,
                     contract: 13, status: beta}
    trading:        {archetypes: 4, layout: 1, constraints: 4, gates: 1, standard: true,
                     contract: 13, status: internal_only}

  # 계약은 다 찼는데 발행이 막히는 경우 — 둘은 다릅니다
  blocked_despite_contract:
    - posture: trading
      reason: |
        🔴 holding_history 슬롯은 v0.5에서 정의했으나 **수집 경로(등기부 파싱)가
        미구현**입니다. L축이 비어 R0 이고, R0 은 P 가 아무리 좋아도 D등급입니다.
        게이트 G30 은 통과합니다 — **계약 충족과 자료 충족은 다릅니다.**
      unblocks: [holding_history 수집 구현, 권역 회전율 산출, 비교사례 6건 UI, 실증 1건]

  note: |
    남은 것은 계약 칸이 아니라 **실증과 수집 구현**입니다.
      owner_occupied  실증 0건
      operating       실증 1건 · 아키타입 가설
      trading         실증 0건 · 수집 경로 미구현
      전 포스처        im.pages.yaml 에 포스처별 면 순서 없음 (수익형만)

