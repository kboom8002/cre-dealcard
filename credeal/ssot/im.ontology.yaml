meta:
  id: im.ontology
  version: 1
  owner: D24 IM_ONTOLOGY_UPGRADE.md — 온톨로지 보완 **요구서**입니다
  note: |
    🔴 이 파일은 온톨로지 정본이 **아닙니다.** 정본은
    CATALOG_SLOTS / CATALOG_RULES / CATALOG_ASSET_TYPES / CATALOG_LEXICON /
    ONTOLOGY_V0.5_SPEC / ONTOLOGY_GOVERNANCE_SPEC 입니다.

    이 파일은 두 가지만 담습니다.
      ① 정본에 무엇을 더해야 새 IM 스펙과 파이프라인이 얹히는가
      ② 그 상태를 기계가 매번 확인할 수 있게 하는 기준값

    보완이 정본에 반영되면 해당 항목의 status 를 `반영` 으로 바꾸고,
    `qa/ontology_check.py` 가 통과하면 이 파일은 역할을 다합니다.

# ── 층위 소유 — 무엇이 어디에 사는가 ───────────────────────────────────
# 새 규칙을 만들 때 **여기부터 봅니다.** 층을 잘못 고르면 다른 포스처에
# 확장할 때 반드시 다시 만들게 됩니다.
layering:
  layers:
  - layer: 온톨로지 (CATALOG_*)
    holds: 포스처·자산유형과 **무관하게** 참인 것
    examples:
      - 슬롯 정의와 enum
      - 판정 코드 공간 (R·T·P·C·G·L·M·F·S·X)
      - 어휘 — 금지어·치환어·표기 규칙
      - 출처 등급 체계
      - 변경 절차와 불변 규칙
    test: |
      "개발형에서도 참인가?" 를 물어 참이면 온톨로지입니다.
  - layer: 포스처 표준 (IM_STANDARD_*)
    holds: 한 포스처에서만 참인 것
    examples:
      - 섹션 구성과 강조 섹션
      - Cap Rate 기준 조합
      - 필수 요소 목록
      - 분량
    test: '"수익형에서만 참인가?" 가 예이면 포스처 표준입니다.'
  - layer: 구현 규격 (D19 · D22)
    holds: 지면·카피·게이팅의 구체
    examples: [페이지 순서, 프리셋, 텍스트 예산, 블록 게이팅]
  - layer: 기계 판독 (credeal/ssot/*.yaml)
    holds: 위 세 층의 **값**. 서술은 md 가, 값은 yaml 이 소유합니다

# 지금 잘못된 층에 있는 것
misplaced:
